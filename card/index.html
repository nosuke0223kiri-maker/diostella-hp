<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diostella | ディオステラ</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- 名刺のQRコード専用URL（2026-09-06新設）＝https://diostella.jp/card
       名刺は刷ったら差し替えられないため、行き先はこのページで持つ（後からアプリのストアURL等へ切り替え可）。
       GitHub Pagesはサーバー側の転送が書けない＝meta refresh＋JSで転送する。?ref=card は来訪元の目印 -->
  <meta http-equiv="refresh" content="0; url=/?ref=card">
  <link rel="canonical" href="https://diostella.jp/">
  <link rel="icon" href="/favicon.ico">
  <script>location.replace("/?ref=card");</script>
</head>
<body>
  <p style="font-family:'Noto Sans JP',sans-serif;text-align:center;padding:40px 24px;color:#0b1e3f;">
    Diostellaのサイトへ移動しています。切り替わらない場合は <a href="/?ref=card" style="color:#a8873a;">こちら</a> をタップしてください。
  </p>
</body>
</html>
