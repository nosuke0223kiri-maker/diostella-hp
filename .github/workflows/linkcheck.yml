# リンク切れの自動巡回（2026-08-10導入）＝毎月1日朝9時（JST）に全HTMLのリンクを踏んで、
# 死んでいたらワークフローが赤になりGitHubからメール通知が届く。手動実行もActionsタブから可能。
name: Link Check
on:
  schedule:
    - cron: "0 0 1 * *" # UTC 00:00 = JST 09:00 毎月1日
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（タグ差し替え対策でSHA固定・2026-08-27）
      - name: リンク切れ検査（内部リンク＋外部URL・メールリンクは対象外）
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2（第三者製Action・同上）
        with:
          args: --no-progress --exclude-mail "**/*.html"
          fail: true
